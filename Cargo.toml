[package]
name = "minimal-jam"
version = "0.1.0"
edition = "2021"
description = "Minimal, GP-faithful JAM STF subsystems verified against davxy/jam-test-vectors (tiny)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
blake2 = "0.10"
sha3 = "0.10"
jam-codec = { version = "0.1.1", features = ["derive", "serde"] }
ark-vrf = { version = "=0.1.0", default-features = false, features = ["std", "bandersnatch"] }
ark-serialize = { version = "=0.5.0", default-features = false }
[dev-dependencies]
